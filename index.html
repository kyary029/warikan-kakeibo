<!--SKEL-->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#375795">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="わりかん家計簿">
<meta name="description" content="ふたりの家計簿と割り勘の清算を、1回の入力でまとめて。">
<!--/SKEL-->
<title>わりかん家計簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Archivo:wght@500;600;700&display=swap">
<style>
/* Layout: one column of stacked cards, phone-first — a ledger you thumb through month by month */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#F6F8FB;
  --fg:#171A20; --fg-2:#596273; --fg-3:#767F8E;
  --line:#E2E7EF; --line-2:#EEF1F6;
  --accent:#3D5A98; --accent-soft:#E7EDF8; --on-accent:#FFFFFF;
  --hero:#375795;
  --pa:#3D5A98; --pa-soft:#E7EDF8; --pa-ink:#3D5A98;
  --pb:#B06E2E; --pb-soft:#F7E8D4; --pb-ink:#7F4C18;
  --good:#1F7A54; --good-soft:#D8EFE4;
  --danger:#AE3B33;
  --r:20px;
  --font-ja:"Zen Maru Gothic", system-ui, -apple-system, "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-num:"Archivo", ui-sans-serif, system-ui, sans-serif;
  --shadow:0 1px 2px rgba(23,26,32,.06), 0 10px 24px -14px rgba(23,26,32,.4);
  --k0:#8A93A2; --k1:#2a78d6; --k2:#eb6834; --k3:#1baf7a; --k4:#eda100;
  --k5:#e87ba4; --k6:#008300; --k7:#6250d6; --k8:#e34948;
  /* the same hues, dimmed only as far as white lettering needs */
  --s0:#6f7785; --s1:#2a76d3; --s2:#bd5831; --s3:#1b8562; --s4:#9b6e10;
  --s5:#aa5f7f; --s6:#008300; --s7:#6250d6; --s8:#d14545;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1116; --surface:#191C23; --surface-2:#20242D;
  --fg:#E7EAF0; --fg-2:#A3ACBA; --fg-3:#7A8390;
  --line:#2A2F3A; --line-2:#232833;
  --accent:#5E8BD6; --accent-soft:#1E2A3F; --on-accent:#0F1620;
  --pa:#5E8BD6; --pa-soft:#1E2A3F; --pa-ink:#8FB4EC;
  --pb:#BE8135; --pb-soft:#2F2619; --pb-ink:#E0A75F;
  --good:#4FA179; --good-soft:#17291F;
  --hero:#22304C;
  --danger:#D4756B;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px -14px rgba(0,0,0,.8);
  --k0:#7A8390; --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500;
  --k5:#d55181; --k6:#008300; --k7:#9085e9; --k8:#e66767;
  --s0:#6e7784; --s1:#3477c9; --s2:#c65326; --s3:#198662; --s4:#9f6d0a;
  --s5:#c24c78; --s6:#008300; --s7:#746dbb; --s8:#bb585a;
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1116; --surface:#191C23; --surface-2:#20242D;
  --fg:#E7EAF0; --fg-2:#A3ACBA; --fg-3:#7A8390;
  --line:#2A2F3A; --line-2:#232833;
  --accent:#5E8BD6; --accent-soft:#1E2A3F; --on-accent:#0F1620;
  --pa:#5E8BD6; --pa-soft:#1E2A3F; --pa-ink:#8FB4EC;
  --pb:#BE8135; --pb-soft:#2F2619; --pb-ink:#E0A75F;
  --good:#4FA179; --good-soft:#17291F;
  --hero:#22304C;
  --danger:#D4756B;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px -14px rgba(0,0,0,.8);
  --k0:#7A8390; --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500;
  --k5:#d55181; --k6:#008300; --k7:#9085e9; --k8:#e66767;
  --s0:#6e7784; --s1:#3477c9; --s2:#c65326; --s3:#198662; --s4:#9f6d0a;
  --s5:#c24c78; --s6:#008300; --s7:#746dbb; --s8:#bb585a;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ja);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  box-shadow:0 3px 12px -8px rgba(23,26,32,.5);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:9px}
.mnav{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.mbtn{width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;border-radius:50%;color:var(--fg-2)}
.mbtn:hover{background:var(--surface-2);color:var(--fg)}
.mlabel{font-weight:700;font-size:17px;letter-spacing:.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--fg-2)}
.today:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:50%;color:var(--fg-2)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}

/* layout */
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 150px;display:flex;flex-direction:column;gap:11px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:28;display:flex;background:var(--surface);box-shadow:0 -3px 14px -8px rgba(40,90,130,.5);
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tb{flex:1;min-width:0;border:0;background:transparent;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg-2);font-size:10.5px;font-weight:700;white-space:nowrap}
.tb svg{width:21px;height:21px;display:block}
.tb:hover{color:var(--fg-2)}
.tb[aria-pressed="true"]{color:var(--accent)}
.card{background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.paid{padding:8px 16px 15px;display:flex;flex-direction:column}
.paidrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:15.5px}
.paidrow:last-child{border-bottom:0}
.paid-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
.paid-v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:17.5px}
.footnote{font-size:12.5px;line-height:1.75;color:var(--fg-2);text-align:center;padding:2px 12px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card-a{border:0;background:transparent;padding:0;font-size:13px;font-weight:700;color:var(--accent)}
.card-a:hover{opacity:.75}
/* ホームの要約: 合計を大きく、だれがいくら出したかを一本の帯と行で */
.sumbox{padding:6px 16px 15px;display:flex;flex-direction:column;gap:10px}
.sum-v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:31px;line-height:1.15;letter-spacing:-.02em}
.track.stack{display:flex;gap:2px;height:11px;background:var(--line-2)}
/* だれがいくら出したか: ひとり1枚のカードを横に並べて */
.duo{display:flex;gap:11px}
.pcard{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:17px;box-shadow:var(--shadow);padding:11px 12px}
.ring{flex:none;width:46px;height:46px;display:block}
.ring-t{font-family:var(--font-num);font-size:9.5px;font-weight:700;fill:var(--fg-3)}
.pcard-m{flex:1;min-width:0;display:flex;flex-direction:column}
.pcard-n{font-size:13.5px;font-weight:700;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:15.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
.pcard-v.neg{color:var(--danger)}
/* やりくり: 濃紺の下に、使ったぶんを同じカードの中でつなげる */
.sumfoot{display:flex;align-items:center;gap:12px;padding:12px 16px 14px}
.sf-m{flex:1;min-width:0;display:flex;flex-direction:column}
.sf-k{font-size:13.5px;font-weight:700;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf-s{font-size:11.5px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf-v{flex:none;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.sf-v.neg{color:var(--danger)}
.delta{font-size:12.5px;font-weight:700;color:var(--fg-3)}
.delta.up{color:var(--danger)}
.delta.down{color:var(--good)}
.sum-sub{font-size:12.5px;color:var(--fg-3);border-top:1px solid var(--line-2);padding-top:9px}
.sum-sub b{font-family:var(--font-num);font-weight:700;color:var(--fg-2)}
/* 最近の記録 */
.minis{padding:6px 16px 10px}
.mini{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 16px;margin:0 -16px;border-bottom:1px solid var(--line-2)}
.mini:last-child{border-bottom:0}
.mini:hover,.mini:active{background:var(--surface-2)}
.mini-m{flex:1;min-width:0;display:flex;flex-direction:column}
.mini-n{font-size:14.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-d{font-size:11.5px;color:var(--fg-3);font-family:var(--font-num)}
.mini-a{flex:none;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:15.5px}
.card-t{font-size:13.5px;font-weight:700;letter-spacing:.06em;color:var(--fg-2)}
.card-n{font-size:13px;color:var(--fg-3)}

/* hero */
.hero{padding:0;text-align:center;background:var(--surface)}
/* 清算パネルは濃い色で、文字と猫を白く抜く */
/* 背景は猫のイラスト。下half は少し落として、白い文字が沈まないように */
.hero-top{position:relative;overflow:hidden;padding:92px 16px 22px;
  background:linear-gradient(to bottom, rgba(42,60,104,0) 38%, rgba(40,57,100,.5) 100%), var(--hero) url("hero.jpg") center/cover no-repeat;
  --fg:#FFFFFF; --fg-2:rgba(255,255,255,.82); --fg-3:rgba(255,255,255,.62);
  --surface:var(--hero); --line-2:rgba(255,255,255,.22); --danger:#FFAEA2}
.hero-btn{position:absolute;top:11px;right:11px;z-index:1;border:0;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;
  background:var(--accent);color:var(--on-accent);box-shadow:0 4px 12px -4px rgba(26,70,130,.55);font-size:13px}
.hero-btn:hover{filter:brightness(1.1)}
.hero-btn.done{background:var(--good-soft);color:var(--good);box-shadow:none}
.hero-cat{display:block;width:76px;height:64px;margin:0 auto 4px}
.hero-k{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--fg-2)}
/* やりくりは絵なしで、同じ青の無地・背を低く */
/* 金額がリングと同じ高さに来るよう、上下の余白を寄せている */
.hero-top.plain{background:#375795;padding:21px 16px 12px}
.hero-top.plain .hero-amt{font-size:34px}
.hero-top.plain .hero-sub{margin-top:5px}
.hero-top .chip{background:rgba(255,255,255,.93)}
.hero-top .hero-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);color:#FFFFFF;
  padding:6px 12px;font-size:12px;box-shadow:none;backdrop-filter:blur(2px)}
.hero-top .hero-btn:hover{filter:none;background:rgba(255,255,255,.3)}
.hero-top .hero-btn.done{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#FFFFFF}
.namerow{display:flex;align-items:center;gap:11px}
.namerow .inp{flex:1;min-width:0}
.hero-flow{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.a{background:var(--pa-soft);color:var(--pa-ink)}
.chip.b{background:var(--pb-soft);color:var(--pb-ink)}
.arrow{color:var(--fg-3);font-size:17px}
.hero-amt{display:block;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-.02em;color:var(--fg)}
/* やりくり: 円グラフを金額の左に */
.herorow{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:6px}
.hero-ring{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:block;--line-2:rgba(255,255,255,.26)}
.hero-ring .ring{width:58px;height:58px}
.hero-ring .ring-t{fill:#FFFFFF;font-size:9px}
.hero-m{text-align:left;min-width:0}
.hero-m .hero-sub{display:block;margin-top:2px}
.hero-amt.zero{font-size:26px;color:var(--fg-2)}
.hero-sub{font-size:13.5px;color:var(--fg-2);margin-top:8px}
.hbar{margin:14px auto 0;max-width:260px;height:8px;border-radius:5px;background:rgba(10,20,45,.38);overflow:hidden}
.hbar span{display:block;height:100%;border-radius:5px;background:#CFE0FF}
.hbar.over span{background:var(--danger)}
.hero-note{margin-top:8px;font-size:12px;color:rgba(255,255,255,.82)}
.hero-note b{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;color:#FFFFFF}
.hero-act{margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 21px;font-size:15px;font-weight:700}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.ghost{border-color:transparent;color:var(--fg-3);font-weight:500}
.btn.ghost:hover{color:var(--danger);border-color:transparent}
.settled{display:inline-flex;align-items:center;gap:7px;background:var(--good-soft);color:var(--good);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700}

/* bars */
.rows{padding:12px 16px 16px;display:flex;flex-direction:column;gap:11px}
.row{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.row-l{font-size:13.5px;color:var(--fg-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.track{grid-column:1/-1;display:block;height:9px;border-radius:5px;background:var(--line-2);overflow:hidden}
.fill{display:block;height:100%;border-radius:5px;background:var(--accent);min-width:5px}
.fill.a{background:var(--pa)} .fill.b{background:var(--pb)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.av{display:block;flex:none;width:28px;height:28px}
.chip .av{width:20px;height:20px}
.sub .av,.seg button .av{width:23px;height:23px}
.paidrow .av,.namerow .av{width:30px;height:30px}
.empty-cat{display:block;width:94px;height:66px;margin:0 auto 14px}
.dot.a{background:var(--pa)} .dot.b{background:var(--pb)}

/* stat strip */
/* the ふたり / 個人 switch: one slim pill so the ledger below gets the room */
.seg2{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg2 button{flex:1;min-width:0;border:0;background:transparent;border-radius:999px;padding:9px 6px;
  font-size:14px;font-weight:700;color:var(--fg-2);display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;overflow:hidden}
.seg2 button b{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:14.5px}
.seg2 button:hover{color:var(--fg)}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg2 button[aria-pressed="true"]:hover{color:var(--on-accent)}
.stats{display:flex;gap:7px;padding:8px}
.stat{flex:1;min-width:0;padding:11px 5px 12px;text-align:center;background:var(--surface-2);border:2px solid transparent;border-radius:15px}
.stat:hover{background:var(--accent-soft)}
.stat[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.stat[aria-pressed="true"] .stat-k,.stat[aria-pressed="true"] .stat-v{color:var(--accent)}
.stat-k,.stat-v{display:block}
.stat-k{font-size:12px;color:var(--fg-2);letter-spacing:.04em}
.stat-v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:19px;margin-top:1px}
.filt-hint{font-size:12px;color:var(--fg-3);text-align:center;padding:0 12px 13px}
.rowbtn{display:grid;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 9px;margin:0 -9px;opacity:.5}
.rowbtn.on{opacity:1;background:var(--surface-2);border-color:var(--line)}
.rowbtn:hover{opacity:1}
.subtabs{display:flex;gap:9px}
.sub{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;overflow:hidden;
  border:1px solid transparent;background:var(--surface);border-radius:17px;padding:10px 8px;font-size:14.5px;color:var(--fg-2);box-shadow:var(--shadow)}
.sub .num{font-weight:700;color:var(--fg)}
.sub.a[aria-pressed="true"]{border-color:var(--pa);background:var(--pa-soft);color:var(--pa-ink)}
.sub.b[aria-pressed="true"]{border-color:var(--pb);background:var(--pb-soft);color:var(--pb-ink)}
/* donut: part-to-whole for the month, every slice named in the legend beside it */
.pie{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px 15px}
.donut{width:136px;height:136px;flex:none;margin:0 auto}
.donut .sl{transition:opacity .15s}
.donut:hover .sl{opacity:.45}
.donut .sl:hover{opacity:1}
.d-k{font-size:9px;fill:var(--fg-2)}
.d-v{font-weight:700;fill:var(--fg);font-family:var(--font-num)}
.legend{flex:1;min-width:148px;display:flex;flex-direction:column;gap:8px}
.lg{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:15px}
.lgb{width:100%;text-align:left;border:1.5px solid transparent;background:transparent;border-radius:12px;padding:5px 8px;margin:0 -8px;color:inherit}
.lgb:hover{background:var(--surface-2)}
.lgb.on{background:var(--accent-soft);border-color:var(--accent)}
.catbar{--k:var(--k0);display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13.5px;font-weight:700;color:var(--fg-2);
  background:color-mix(in srgb, var(--k) 14%, var(--surface));
  border-top:1px solid color-mix(in srgb, var(--k) 30%, var(--surface));
  border-bottom:1px solid color-mix(in srgb, var(--k) 30%, var(--surface))}
.catbar .cat{background:var(--surface)}
.catbar button{margin-left:auto;flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;color:var(--fg-2)}
.catbar button:hover{border-color:var(--accent);color:var(--accent)}
.sw{width:11px;height:11px;border-radius:3px}
.lg-k{color:var(--fg-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-k i{font-style:normal;color:var(--fg-2);font-size:13px}
.lg-v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

/* list */
.day{padding:0 16px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 -16px;padding:5px 16px;line-height:1.5;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--fg-2);letter-spacing:.02em}
/* a row sits on a track so it can slide left and reveal 削除 */
.swipe{position:relative;margin:0 -16px;overflow:hidden}
.swipe:last-child .item{border-bottom:0}
.swipe-del{position:absolute;top:0;right:0;width:84px;height:100%;border:0;padding:0;background:var(--danger);color:#fff;font-size:14px;font-weight:700;letter-spacing:.04em;display:grid;place-items:center}
.item{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--surface);padding:11px 16px;border-bottom:1px solid var(--line-2);transition:transform .2s cubic-bezier(.22,.61,.36,1);-webkit-tap-highlight-color:transparent}
.item:hover,.item:active{background:var(--surface-2)}
.swipe.open .item{transform:translateX(-84px)}
.cat{--k:var(--k0);flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--line-2)}
.cat{background:color-mix(in srgb, var(--k) 20%, var(--surface));color:color-mix(in srgb, var(--k) 72%, var(--fg));border-color:color-mix(in srgb, var(--k) 46%, var(--surface))}
.item-m{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow:hidden}
.item-n{font-size:15px;color:var(--fg);flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbadge{--k:var(--k0);flex:none;width:29px;height:29px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg-2)}
.cbadge{background:color-mix(in srgb, var(--k) 18%, var(--surface));color:color-mix(in srgb, var(--k) 72%, var(--fg))}
.cico{width:16px;height:16px;display:block}
.item-a{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;flex:none}
.chev{flex:none;color:var(--fg-3);font-size:20px;line-height:1;opacity:.75}
.tag{flex:none;font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--fg-2);white-space:nowrap}
.tag.solo{color:var(--fg-3)}
.tag.fix{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.tag.keep{font-size:10.5px;padding:1px 7px;color:var(--fg-3);border-color:var(--line)}

/* やりくり */
.hero-amt.neg{color:var(--danger)}
.blist{padding:4px 16px 14px;display:flex;flex-direction:column}
.brow{position:relative;display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px}
.brow + .brow{border-top:1px solid var(--line-2)}
.brow-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
.brow-v{flex:none;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.brow-s{display:block;font-style:normal;font-size:11px;color:var(--fg-3);font-family:var(--font-num)}
.brow.ind .brow-n{padding-left:14px;font-size:14px;color:var(--fg-3)}
.brow.ind .brow-n::before{content:"";position:absolute;left:3px;top:50%;margin-top:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--line)}
.brow.ind .brow-v{font-size:15px;color:var(--fg-2)}
.brow.tot,.brow + .brow.tot{border-top:1.5px solid var(--line);margin-top:4px;padding-top:12px}
.brow.tot .brow-n{color:var(--fg);font-weight:700}
.brow.tot .brow-v{font-size:19px}
.brow.hi{padding-bottom:4px}
.brow.hi .brow-v{font-size:23px;color:var(--accent)}
.brow.hi .brow-v.minus{color:var(--danger)}
.bbar{padding:0 16px 16px;display:block}
.bbar .track{height:11px}
.bbar .fill.over{background:var(--danger)}
.bbar-k{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-3);padding-top:7px}
.bnote{margin:0;padding:0 16px 15px;font-size:12.5px;line-height:1.7;color:var(--fg-3)}
.bitems{display:flex;flex-direction:column;gap:7px}
.birow{display:flex;align-items:center;gap:7px}
.bname{flex:1.25;min-width:0}
.bamt{flex:1;min-width:0;text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700}
.bdel{flex:none;width:30px;height:30px;border:0;background:transparent;color:var(--fg-3);border-radius:50%;font-size:13px}
.bdel:hover{background:var(--surface-2);color:var(--danger)}
.btn.addrow{width:100%;margin-top:9px;border-style:dashed;border-color:var(--accent);color:var(--accent);background:transparent;padding:10px}

/* 年間のまとめ */
.ytop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:-2px}
.seg2.mini2{flex:1;max-width:238px;background:var(--surface);padding:3px}
.seg2.mini2 button{flex:1;padding:8px 10px;font-size:13.5px}
.ytitle{font-size:14px;font-weight:700;color:var(--fg-2);letter-spacing:.04em}
.ynav{display:flex;align-items:center;gap:2px}
.ylabel{font-weight:700;font-size:16px;min-width:66px;text-align:center}
.bigbtn{display:block;width:100%;text-align:center;border:0;padding:15px;font-size:14.5px;font-weight:700;color:var(--accent)}
.bigbtn:hover{background:var(--surface-2)}
.avgline{display:flex;align-items:baseline;gap:8px;font-size:13.5px;color:var(--fg-2);margin-top:-4px}
.avgline b{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:16px;color:var(--fg)}
.avgline span{font-size:11.5px;color:var(--fg-3)}
.ybars{display:flex;align-items:flex-end;gap:4px;height:62px;margin-top:2px}
.yb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;border:0;background:transparent;padding:0}
.yb-f{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--accent);min-height:2px}
.yb.off .yb-f{background:var(--line-2)}
.yb-k{font-family:var(--font-num);font-size:10px;color:var(--fg-3);line-height:1}
.yb:hover .yb-f{filter:brightness(1.15)}
.row-s{grid-column:1/-1;font-size:11.5px;color:var(--fg-3);font-family:var(--font-num)}
/* タップできるようにしても、行の間隔は前と同じに見えるよう余白を相殺する */
.row.rowb{width:100%;text-align:left;border:1.5px solid transparent;background:transparent;border-radius:13px;padding:5px 9px;margin:-5px -9px}
.row.rowb:hover{background:var(--surface-2)}
.row.rowb[aria-pressed="true"]{background:var(--surface-2);border-color:var(--line)}
.row-l{display:flex;align-items:center;gap:7px}
.cbadge.sm{width:22px;height:22px;border-radius:7px}
.cbadge.sm .cico{width:13px;height:13px}

/* 最初の1回だけ出る、あいことばの画面 */
body.gated{overflow:hidden}
body.gated .hdr,body.gated .tabbar,body.gated .fab,body.gated #main{display:none}
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:flex;align-items:center;justify-content:center;
  padding:24px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.gate{width:100%;max-width:360px;text-align:center;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 20px 22px}
.gate-t{margin:4px 0 0;font-size:20px;font-weight:700;letter-spacing:.02em}
.gate-s{margin:9px 0 16px;font-size:13.5px;line-height:1.8;color:var(--fg-2)}
.gate-s b{color:var(--accent)}
.gate-e{margin:-8px 0 12px;font-size:12.5px;font-weight:700;color:var(--danger)}
.gate .inp{text-align:center;font-family:var(--font-num);font-size:17px;letter-spacing:.04em}
.gate .btn{width:100%;margin-top:11px;padding:13px}
.gate-stat{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--accent);min-height:18px}
.gate-h{margin:15px 0 0;font-size:11.5px;line-height:1.8;color:var(--fg-3)}
.gate-skip{margin-top:12px;border:0;background:transparent;font-size:12px;color:var(--fg-3);text-decoration:underline;padding:4px}
.gate-h b{color:var(--fg-2)}
.roombox{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:15px;padding:11px 13px}
.roombox .num{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:700}

/* empty + notice */
.empty{padding:34px 20px;text-align:center;color:var(--fg-3)}
.empty-t{font-weight:700;color:var(--fg-2);font-size:16px;margin-bottom:6px}
.empty-s{font-size:14px;line-height:1.75}
.notice{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid transparent;border-radius:var(--r);padding:11px 15px;font-size:13.5px;color:var(--accent)}
.notice b{font-weight:700}
.notice.err{background:color-mix(in srgb, var(--danger) 13%, var(--surface));color:var(--danger)}
.notice button{margin-left:auto;flex:none;border:1px solid currentColor;background:transparent;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700}
.skel{height:7px;border-radius:4px;background:var(--line-2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* fab */
.fab{position:fixed;z-index:25;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));
  width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:28px;line-height:1;
  box-shadow:0 7px 20px -6px rgba(61,90,152,.6);display:grid;place-items:center}
.fab:hover{filter:brightness(1.08)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center;overflow-y:auto;overflow-x:hidden}
@media (min-width:600px){.scrim{align-items:center;padding:24px 0}}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:28px 28px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(20px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow-y:auto;overflow-x:hidden}
.sheet *{max-width:100%}
.fields,.f,.seg,.cats,.sheet-f,.namerow,.newcat-row,.fixlist,.fixrow,.ratio{min-width:0}
@media (min-width:600px){.sheet{border-radius:24px;padding-block:0 20px}}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:13px 10px;border-bottom:1px solid var(--line-2);z-index:1}
.sheet-t{font-weight:700;font-size:16px}
.fields{display:flex;flex-direction:column;gap:12px;padding-block:13px}
.f{display:flex;flex-direction:column;gap:5px}
.row2{display:flex;gap:10px;align-items:flex-end}
.row2 .f{flex:1;min-width:0}
.row2 .f:first-child{flex:1.15}
.f-l{font-size:12.5px;font-weight:700;letter-spacing:.05em;color:var(--fg-2)}
.inp{width:100%;min-width:0;max-width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:15px;padding:11px 14px;font-size:16px}
.inp[type="date"]{-webkit-appearance:none;appearance:none;text-align:center}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.inp.amt{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:23px;font-weight:700;text-align:right;padding:9px 13px}
/* 金額と日付はとなり同士なので、箱の高さをそろえる */
.row2 .inp{height:52px;padding-top:0;padding-bottom:0;line-height:normal}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:15px;padding:12px 8px;font-size:15px;font-weight:700;color:var(--fg-2);overflow:hidden;white-space:nowrap}
.seg button .nm{overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* 割り勘まわりだけはひとまとめ：上は切り替えスイッチ、下はその中身。
   同じ形のボタンが三段つづくと、どれが何の質問か分からなくなるため */
.splitbox{background:var(--surface-2);border:1px solid var(--line-2);border-radius:17px;padding:9px;display:flex;flex-direction:column;gap:9px}
.swt{display:flex;gap:3px;background:var(--line-2);border-radius:999px;padding:3px}
.swt button{flex:1;min-width:0;border:0;background:transparent;border-radius:999px;padding:9px 6px;font-size:14.5px;font-weight:700;color:var(--fg-2);white-space:nowrap;overflow:hidden}
.swt button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(23,26,32,.2)}
.bearwrap{display:flex;flex-direction:column;gap:5px;padding:1px 2px 2px}
.bear{display:flex;align-items:center;gap:6px}
.bear-l{font-size:12px;font-weight:700;color:var(--fg-2);letter-spacing:.04em;padding-left:3px}
/* 入れた内容を一文で読み返せるように（「りゅが◯◯円はらって、ふたりで半分ずつ」） */
.say{background:var(--accent-soft);border-radius:15px;padding:11px 14px;font-size:14.5px;line-height:1.75;color:var(--fg-2)}
.say b{font-weight:700;color:var(--accent)}
.say .m{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:16.5px;color:var(--accent)}
.say .m.off{color:var(--fg-3)}
.bchip{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 5px;font-size:13.5px;color:var(--fg-2);overflow:hidden;white-space:nowrap}
.bchip .nm{overflow:hidden;text-overflow:ellipsis}
.bchip .av{width:20px;height:20px}
.bchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.bear-n{margin:0;padding:0 4px 3px;font-size:12.5px;color:var(--fg-3)}
/* the category picker keeps the panel the same height, so nothing jumps under your thumb */
/* カテゴリーはその場で開く。別画面に飛ばないので、入力の途中で迷子にならない */
.catpanel{margin-top:8px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:15px;padding:10px}
.catpanel .cats button{background:color-mix(in srgb, var(--k) 16%, var(--surface));border-color:color-mix(in srgb, var(--k) 16%, var(--surface))}
.nm-a{font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{--k:var(--k0);--ks:var(--accent);border:2px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 12px;font-size:14px;color:var(--fg-2);max-width:100%}
.cats button{background:color-mix(in srgb, var(--k) 16%, var(--surface));border-color:color-mix(in srgb, var(--k) 16%, var(--surface));color:color-mix(in srgb, var(--k) 70%, var(--fg))}
.cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.cats button[aria-pressed="true"]{background:color-mix(in srgb, var(--k) 88%, #fff);border-color:transparent;color:#fff}
.cats .addcat{border-style:dashed;border-color:var(--accent);background:var(--surface-2);color:var(--accent);font-weight:700;box-shadow:none}
.catrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:15px;padding:8px 12px;font-size:16px;color:var(--fg)}
.catrow:hover{border-color:var(--accent)}
.catrow .chev{transition:transform .16s}
.catrow.open{border-color:var(--accent);background:var(--surface)}
.catrow.open .chev{transform:rotate(90deg);color:var(--accent);opacity:1}
.catrow-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--fg-2);white-space:nowrap}
.dayrow .inp{flex:0 0 84px;text-align:center}
.newcat-row{display:flex;gap:8px;margin-top:8px}
.newcat-row .inp{flex:1;min-width:0}
.newcat-row .btn{flex:none}
.catpill{--k:var(--k0);display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 10px 6px 13px;font-size:14px;color:var(--fg-2)}
.catpill{background:color-mix(in srgb, var(--k) 18%, var(--surface));border-color:color-mix(in srgb, var(--k) 44%, var(--surface));color:color-mix(in srgb, var(--k) 70%, var(--fg))}
.catpill.custom{font-weight:700;border-color:var(--k)}
.catpill button{border:0;background:transparent;color:inherit;font-size:11px;padding:0 3px;line-height:1;opacity:.65;border-radius:50%}
.catpill button:hover{opacity:1}
.sheet-f{display:flex;gap:9px;padding-block:5px 0}
.sheet-f .btn{flex:1;padding:13px}
.hint{font-size:12.5px;color:var(--fg-2);line-height:1.7}
.fixlist{display:flex;flex-direction:column;gap:8px}
.fixrow{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:15px;padding:10px 13px}
.fixrow .item-m{min-width:0}
.ratio{display:flex;align-items:center;gap:12px}
.ratio input[type=range]{flex:1;accent-color:var(--accent)}
.ratio-v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:4px 0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<!--/SKEL-->

<header class="hdr">
  <div class="hdr-in">
    <nav class="mnav">
      <button class="mbtn" data-act="prev" aria-label="前の月">‹</button>
      <span class="mlabel num" id="mlabel">　</span>
      <button class="mbtn" data-act="next" aria-label="次の月">›</button>
    </nav>
    <button class="today" data-act="today">今月</button>
    <button class="iconbtn" data-act="settings" aria-label="設定">⚙</button>
  </div>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="wob" x="-12%" y="-12%" width="124%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="2" seed="5" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<main class="wrap" id="main">
  <section class="card hero">
    <div class="hero-top">
      <div class="hero-k">今月の清算</div>
      <div class="skel" style="width:58%;margin:14px auto 2px;height:30px"></div>
    </div>
  </section>
</main>

<button class="fab" data-act="add" aria-label="支出を追加">＋</button>

<nav class="tabbar">
  <button class="tb" data-act="view" data-v="home" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.8V20h13V9.8"/><path d="M9.8 20v-5h4.4v5"/></svg>
    <span>ホーム</span>
  </button>
  <button class="tb" data-act="view" data-v="detail" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 3.8A8.2 8.2 0 0 1 20.2 12H12z" fill="currentColor" stroke="none"/></svg>
    <span>明細</span>

/* a donut, drawn by hand: one arc per slice, 2px of surface between them */
function donut(parts, total){
  const C = 2 * Math.PI * 45;
  let acc = 0;
  const segs = parts.map(function(p, i){
    const len = total ? p.v / total * C : 0;
    const dash = Math.max(len - 2, 0.8);
    const s = '<circle class="sl" cx="60" cy="60" r="45" fill="none" stroke="'+p.c+'" stroke-width="17"'
            + ' stroke-dasharray="'+dash.toFixed(2)+' '+(C - dash).toFixed(2)+'"'
            + ' stroke-dashoffset="'+(-acc).toFixed(2)+'"><title>'+esc(p.k)+' '+yen(p.v)+'</title></circle>';
    acc += len; return s;
  }).join("");
  const label = yen(total);
  const fs = label.length > 9 ? 10.5 : (label.length > 7 ? 12.5 : 14.5);
  return '<svg viewBox="0 0 120 120" class="donut" role="img" aria-label="カテゴリー別の内訳">'
       + '<circle cx="60" cy="60" r="45" fill="none" stroke="var(--line-2)" stroke-width="17"></circle>'
       + '<g transform="rotate(-90 60 60)">' + segs + '</g>'

       + '<text class="d-v" x="60" y="70" text-anchor="middle" style="font-size:'+fs+'px">'+esc(label)+'</text>'
       + '</svg>';
}

/* ---------- the one calculation everything hangs off ---------- */
function calc(expenses, ratioA){
  const shared = expenses.filter(e => e.shared !== false);
  const solo   = expenses.filter(e => e.shared === false);
  const sharedTotal = sum(shared);
  const paidA = sum(shared.filter(e => e.payer === "a"));
  const paidB = sharedTotal - paidA;
  /* normally split by the ratio; an entry with a bearer is carried by that person alone */
  const dueA = shared.reduce(function(t, e){
    const amt = Number(e.amount) || 0;
    if (e.bearer === "a") return t + amt;
    if (e.bearer === "b") return t;
    return t + amt * (Number(ratioA) || 50) / 100;
  }, 0);
  const diff  = Math.round(paidA - dueA);          // >0: B owes A
  return {
    total: sum(expenses), sharedTotal, paidA, paidB, diff, dueA,
    soloA: sum(solo.filter(e=>e.payer==="a")), soloB: sum(solo.filter(e=>e.payer==="b")),
    from: diff > 0 ? "b" : "a", to: diff > 0 ? "a" : "b", owed: Math.abs(diff)
  };
}

/* Firestore を、これまで使ってきた書き方のまま触れるようにする薄い皮 */
function fbAdapter(fs, M, room){
  function wrapQ(s){
    return { docs: s.docs.map(function(d){ return { id:d.id, data:function(){ return d.data(); } }; }),
             metadata: { fromCache: !!(s.metadata && s.metadata.fromCache) } };
  }
  return {
    collection: function(name){
      const col = M.collection(fs, "rooms", room, name);
      return {
        doc: function(id){
          const ref = id ? M.doc(col, id) : M.doc(col);
          return {
            set: function(body){ return M.setDoc(ref, body); },
            delete: function(){ return M.deleteDoc(ref); },
            onSnapshot: function(cb, err){
              return M.onSnapshot(ref, function(s){ cb({ exists: s.exists(), data: function(){ return s.data(); } }); }, err);
            }
          };
        },
        where: function(f, op, v){
          const q = M.query(col, M.where(f, op, v));
          return {
            onSnapshot: function(cb, err){ return M.onSnapshot(q, function(s){ cb(wrapQ(s)); }, err); },
            get: function(){ return M.getDocs(q).then(wrapQ); }
          };
        },
        onSnapshot: function(cb, err){ return M.onSnapshot(col, function(s){ cb(wrapQ(s)); }, err); },
        get: function(){ return M.getDocs(col).then(wrapQ); }
      };
    }
  };
}

const FB_VER = "10.12.5";
/* 読み込み先が詰まることがあるので、2つ用意して先に着いたほうを使う */
async function loadFbSdk(){
  const sets = [
    ["https://www.gstatic.com/firebasejs/"+FB_VER+"/firebase-app.js",
     "https://www.gstatic.com/firebasejs/"+FB_VER+"/firebase-auth.js",
     "https://www.gstatic.com/firebasejs/"+FB_VER+"/firebase-firestore.js"],
    ["https://esm.sh/firebase@"+FB_VER+"/app",
     "https://esm.sh/firebase@"+FB_VER+"/auth",
     "https://esm.sh/firebase@"+FB_VER+"/firestore"]
  ];
  let last = null;
  for (const urls of sets){
    try { return await Promise.all(urls.map(function(u){ return import(u); })); }
    catch(e){ last = e; }
  }
  throw last || new Error("sdk");
}
function withTimeout(p, ms, tag){
  return Promise.race([p, new Promise(function(_, rej){
    setTimeout(function(){ rej(new Error("timeout:"+tag)); }, ms);
  })]);
}
function gateSay(t){ const el = $("#g-stat"); if (el) el.textContent = t; }
async function initFirebase(room){
  gateSay("① Firebaseを読み込み中…");
  const [A, U, F] = await withTimeout(loadFbSdk(), 20000, "sdk");
  gateSay("② ログイン中…");
  const app = A.initializeApp(window.FB_CONFIG);
  await withTimeout(U.signInAnonymously(U.getAuth(app)), 20000, "auth");
  gateSay("③ データにつないでいます…");
  db = fbAdapter(F.getFirestore(app), F, room);
  state.mode = "db"; state.room = room;
  wireDb();
  gateSay("④ 完了");
}

async function initStore(){
  try {
    db = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("db") : null;
  } catch(e){ db = null; }
  if (db){ state.mode = "db"; wireDb(); return; }

}

function dbErr(e){
  if (e && (e.code === "revoked" || e.code === "not_granted")) state.readOnly = true;
  /* つながらない理由を画面に出す（真っ白で止まらないように） */
  state.dbError = (e && (e.code || e.message)) ? String(e.code || e.message) : "不明なエラー";
  state.ready = true;
  render();
}

function wireDb(){
  db.collection("settings").doc("app").onSnapshot(s => {
    state.settings = Object.assign({}, DEFAULTS, s.exists ? s.data() : null); render();
  }, dbErr);
  db.collection("recurring").onSnapshot(s => {
    state.recurring = s.docs.map(d => Object.assign({id:d.id}, d.data())); materialize(); render();
  }, dbErr);
  db.collection("budget").onSnapshot(s => {
    const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); state.budgets = o; render();
  }, dbErr);
  db.collection("settlements").onSnapshot(s => {
    const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); state.settlements = o; render();
  }, dbErr);
  subExpenses();
}
/* 先月のふたりの支出だけ、くらべるために別で見ておく */
function subPrev(){
  if (unsubPrev) unsubPrev();
  state.prevShared = null;
  const pm = ymAdd(state.month, -1);
  unsubPrev = db.collection("expenses").where("month","==",pm).onSnapshot(function(s){
    state.prevShared = s.docs.map(function(d){ return d.data(); })
      .filter(function(e){ return e.shared !== false; })
      .reduce(function(t,e){ return t + (Number(e.amount)||0); }, 0);
    render();
  }, function(){});
}
function subExpenses(){
  subPrev();
  if (unsubExpenses) unsubExpenses();
  state.ready = false;
  unsubExpenses = db.collection("expenses").where("month","==",state.month).onSnapshot(s => {
    state.expenses = s.docs.map(d => Object.assign({id:d.id}, d.data()));
    state.ready = true;
    if (!s.metadata.fromCache) materialize();
    render();
  }, dbErr);
}
function loadLocal(){
  const all = LS.get("wk_expenses", []);
  state.expenses   = all.filter(e => e.month === state.month);
  state.recurring  = LS.get("wk_recurring", []);
  state.settlements= LS.get("wk_settlements", {});
  state.budgets    = LS.get("wk_budget", {});
  const pm = ymAdd(state.month, -1);
  state.prevShared = all.filter(function(e){ return e.month === pm && e.shared !== false; })
    .reduce(function(t,e){ return t + (Number(e.amount)||0); }, 0);
  state.settings   = Object.assign({}, DEFAULTS, LS.get("wk_settings", null));
}

async function putExpense(e){
  state.yearExp = null;                 /* 年間のまとめは次に開くとき読み直す */
  if (state.mode === "db"){
    const body = Object.assign({}, e); delete body.id;
    await db.collection("expenses").doc(e.id || undefined).set(body);
  } else {
    const all = LS.get("wk_expenses", []);
    if (e.id){ const i = all.findIndex(x => x.id === e.id); if (i >= 0) all[i] = e; else all.push(e); }
    else { e.id = uid("e"); all.push(e); }
    LS.set("wk_expenses", all); loadLocal(); render();
  }
}
async function dropExpense(id){

function guard(p){ return Promise.resolve(p).catch(e => { if (e && e.code === "invalid_argument"){ state.readOnly = true; render(); } }); }

/* ---------- fixed costs appear in the month on their own ---------- */
const materialized = new Set();
async function materialize(){
  const m = state.month;
  if (materialized.has(m) || !state.ready || state.readOnly) return;
  if (m > THIS_MONTH || !state.recurring.length) return;
  materialized.add(m);
  const already = new Set(state.expenses.filter(e => e.recurringId).map(e => e.recurringId));
  const dim = daysInMonth(m);
  for (const r of state.recurring){
    if (r.active === false || already.has(r.id)) continue;
    if (r.startMonth && m < r.startMonth) continue;
    await guard(putExpense({
      id: "fx-" + r.id + "-" + m,   /* fixed id, so a second run overwrites instead of duplicating */
      month: m, date: m + "-" + pad(Math.min(Number(r.day)||1, dim)),
      amount: Number(r.amount)||0, category: r.category || "住居",
      payer: r.payer || "a", shared: r.shared !== false,
      note: r.name || "固定費", recurringId: r.id, createdAt: Date.now()
    }));
  }
}

function bodyHtml(){
  const s = state.settings, c = calc(state.expenses, s.ratioA);
  const settled = state.settlements[state.month];
  const names = { a: s.nameA || DEFAULTS.nameA, b: s.nameB || DEFAULTS.nameB };
  const f = state.filter;
  const who = meNow();   /* the personal tab is always this device's own person */
  const shown = f === "solo" ? state.expenses.filter(e => e.shared === false && (e.payer || "a") === who)
                             : state.expenses.filter(e => e.shared !== false);
  const shownTotal = sum(shown);
  const out = [];

  if (state.dbError) out.push('<div class="notice err"><b>接続エラー</b>'+esc(state.dbError)+'</div>');

  if (state.view === "year") return yearHtml(names, who);

  /* ---- ホーム: the settlement, and who put in how much ---- */
  if (state.view === "home"){
  out.push('<section class="card hero"><div class="hero-top">');
  if (settled){
    out.push('<button class="hero-btn done" data-act="unsettle" aria-label="清算を取り消す">✓ 清算済み</button>');
  } else if (c.owed > 0 && !state.readOnly){
    out.push('<button class="hero-btn" data-act="settle">清算済みにする</button>');
  }
  out.push('<div class="hero-k">'+esc(ymLabel(state.month))+'の清算</div>');
  if (!state.expenses.length){
    out.push('<div class="hero-amt zero">まだ記録なし</div>');
    out.push('<div class="hero-sub">右下の ＋ から最初の支出を入れてみてください</div>');
  } else if (c.owed === 0){
    out.push('<div class="hero-amt zero">ぴったり差額なし</div>');
  } else {
    out.push('<div class="hero-flow"><span class="chip '+c.from+'">'+cat(c.from)+esc(names[c.from])+'</span><span class="arrow">→</span><span class="chip '+c.to+'">'+cat(c.to)+esc(names[c.to])+'</span></div>');
    out.push('<div class="hero-amt">'+yen(c.owed)+'</div>');
  }
  out.push('</div></section>');
  if (state.expenses.length){
    /* 今月のふたりの支出：合計をまず大きく、その下に出した割合を一本の帯で */
    const nShared = state.expenses.filter(e => e.shared !== false).length;
    const pct = v => c.sharedTotal ? Math.round(v / c.sharedTotal * 100) : 0;
    const w = v => c.sharedTotal ? Math.max(v / c.sharedTotal * 100, v ? 3 : 0) : 0;
    const mySolo = who === "b" ? c.soloB : c.soloA;
    out.push('<div class="duo">'
      + [["a",names.a,c.paidA],["b",names.b,c.paidB]].map(function(r){
          return '<div class="pcard">'+ring(r[0], pct(r[2]))
               + '<span class="pcard-m"><span class="pcard-n">'+esc(r[1])+'</span>'
               + '<span class="pcard-v">'+yen(r[2])+'</span></span></div>';
        }).join("")
      + '</div>');

    const dlt = (state.prevShared != null && state.prevShared > 0) ? c.sharedTotal - state.prevShared : null;
    out.push('<section class="card"><div class="card-h"><span class="card-t">ふたりの支出</span><span class="card-n">'+nShared+'件</span></div>'
      + '<div class="sumbox">'
      + '<div class="sum-v">'+yen(c.sharedTotal)+'</div>'
      + '<div class="track stack">'
        + (c.paidA ? '<span class="fill a" style="width:'+w(c.paidA).toFixed(1)+'%"></span>' : '')
        + (c.paidB ? '<span class="fill b" style="width:'+w(c.paidB).toFixed(1)+'%"></span>' : '')
      + '</div>'
      + (dlt === null ? '' : '<div class="delta '+(dlt > 0 ? "up" : "down")+'">先月より '
          + (dlt > 0 ? "+" : "−") + yen(Math.abs(dlt)) + (dlt > 0 ? " ↑" : " ↓") + '</div>')
      + (mySolo ? '<div class="sum-sub">このほかに'+esc(names[who])+'の個人の支出が <b>'+yen(mySolo)+'</b></div>' : '')
      + '</div></section>');

    /* 最近の記録：トップからそのまま直近を見て、タップで直せる */
    const mine = state.expenses.filter(e => e.shared !== false || (e.payer || "a") === who)
      .slice().sort(function(x,y){ return x.date === y.date ? (y.createdAt||0)-(x.createdAt||0) : (x.date < y.date ? 1 : -1); });
    if (mine.length){
      out.push('<section class="card"><div class="card-h"><span class="card-t">最近の記録</span>'
        + '<button class="card-a" data-act="view" data-v="detail">すべて見る ›</button></div>'
        + dayGroups(mine.slice(0,4), names)
        + '<div style="height:8px"></div></section>');
    }
  }
  return out.join("");
  }

  /* ---- 明細: the filter, the donut and the ledger ---- */
  if (state.expenses.length){
    const tabs = [["shared","ふたり",c.sharedTotal],["solo","個人",who === "b" ? c.soloB : c.soloA]];
    out.push('<div class="seg2">'
      + tabs.map(function(tb){
          return '<button data-act="filt" data-v="'+tb[0]+'" aria-pressed="'+(f===tb[0])+'">'
               + tb[1] + '<b>' + yen(tb[2]) + '</b></button>';
        }).join("")
      + '</div>');

    /* 3 — who put in how much: just the figures. On the personal tab, buttons that pick whose. */

    /* 4 — what the money went on, as a donut with every slice named beside it */
    const byCat = {};
    shown.forEach(function(e){ const k = e.category || "その他"; byCat[k] = (byCat[k]||0) + (Number(e.amount)||0); });
    const ranked = Object.keys(byCat).map(k => [k, byCat[k]]).sort((x,y) => y[1]-x[1]);
    const usedCol = {};
    const slices = ranked.slice(0,6).map(function(r){
      let col = catVar(r[0]);

      usedCol[col] = 1;
      return { k:r[0], v:r[1], c:col };
    });
    if (ranked.length > 6) slices.push({ k:"ほか", c:"var(--k0)",
      v: ranked.slice(6).reduce(function(t,r){ return t + r[1]; }, 0) });

            const body = '<span class="sw" style="background:'+p.c+'"></span>'
                       + '<span class="lg-k">'+esc(p.k)+' <i>'+pct+'%</i></span>'
                       + '<span class="lg-v">'+yen(p.v)+'</span>';
            if (p.k === "ほか") return '<div class="lg">'+body+'</div>';

            return '<button class="lg lgb'+(on?" on":"")+'" data-act="catfilt" data-v="'+esc(p.k)+'" aria-pressed="'+on+'">'+body+'</button>';
          }).join("")
        + '</div></div>');
    }
    out.push('</section>');
  }

  /* 4 — the ledger itself */
  out.push('<section class="card">');
  const rows = state.cat ? shown.filter(e => (e.category || "その他") === state.cat) : shown;
  out.push('<div class="card-h"><span class="card-t">記録</span><span class="card-n">'+rows.length+'件</span></div>');
  if (!state.expenses.length){
    out.push('<div class="empty">'+sleepingCat()+'<div class="empty-t">この月はまだ空です</div>'
           + '<div class="empty-s">支出を1回入れるだけで、家計簿の集計と<br>割り勘の清算額が同時に出ます。<br>家賃などは設定から固定費に登録しておくと<br>毎月ひとりでに入ります。</div></div>');
  } else if (!rows.length){

  } else {
    out.push(dayGroups(rows, names));
    out.push('<div style="height:8px"></div>');
  }
  out.push('</section>');

  return out.join("");
}

/* 日付ごとの一覧。明細でもホームの「最近の記録」でも同じ見た目で使う */
function dayGroups(list, names){

  list.forEach(function(e){ (days[e.date] = days[e.date] || []).push(e); });
  return Object.keys(days).sort().reverse().map(function(d){
    const inDay = days[d].slice().sort(function(x,y){ return (y.createdAt||0)-(x.createdAt||0); });
    return '<div class="day"><div class="day-h"><span>'+esc(dayLabel(d))+'</span></div>'
      + inDay.map(function(e){
          const note = String(e.note || "").trim();

            + '<button class="swipe-del" data-act="swipedel" data-id="'+esc(e.id)+'" tabindex="-1">削除</button>'
            + '<button class="item" data-act="edit" data-id="'+esc(e.id)+'">'
            + '<span class="cbadge" style="--k:'+catVar(cname)+'" role="img" aria-label="'+esc(cname)+'">'+catIcon(cname)+'</span>'
            + '<span class="item-m"><span class="item-n">'+esc(note || cname)+'</span>'
            + (e.shared !== false && e.bearer ? '<span class="tag">'+esc(e.bearer==="b"?names.b:names.a)+'の分</span>' : '')
            + (e.recurringId ? '<span class="tag fix">固定費</span>' : '')
            + '</span>'
            + '<span class="dot '+(e.payer==="b"?"b":"a")+'" title="'+esc(e.payer==="b"?names.b:names.a)+'"></span>'

/* その支出のうち、自分が持つぶん */
function mineShare(e, who, ratioA){
  const v = Number(e.amount) || 0;
  if (e.shared === false) return (e.payer || "a") === who ? v : 0;
  if (e.bearer) return e.bearer === who ? v : 0;
  const r = (Number(ratioA) || 50) / 100;
  return who === "a" ? v * r : v * (1 - r);
}

async function loadYear(y){

function yearHtml(names, who){
  const y = state.year;
  const out = [];
  /* 年の切り替えと ふたり/個人 を1行にまとめて、下の一覧を広く見せる */
  out.push('<div class="ytop">'
    + '<div class="ynav"><button class="mbtn" data-act="ynav" data-v="-1" aria-label="前の年">‹</button>'
    + '<span class="ylabel num">'+esc(y)+'年</span>'
    + '<button class="mbtn" data-act="ynav" data-v="1" aria-label="次の年">›</button></div>'
    + '<div class="seg2 mini2">'
    + [["shared","ふたり"],["solo","個人"]].map(function(t){
        return '<button data-act="filt" data-v="'+t[0]+'" aria-pressed="'+(state.filter===t[0])+'">'+t[1]+'</button>';
      }).join("")
    + '</div></div>');

  if (state.yearLoading || state.yearExp == null){
    out.push('<section class="card"><div class="empty"><div class="empty-s">読み込み中…</div></div></section>');
    return out.join("");
  }
  const f = state.filter;
  const rows = f === "solo"
    ? state.yearExp.filter(function(e){ return e.shared === false && (e.payer || "a") === who; })
    : state.yearExp.filter(function(e){ return e.shared !== false; });

  if (!rows.length){
    out.push('<section class="card"><div class="empty">'+sleepingCat()
      + '<div class="empty-t">'+esc(y)+'年の記録はまだありません</div></div></section>');
    return out.join("");
  }

  const byMonth = {}, byCat = {}, byCM = {};
  rows.forEach(function(e){
    const m = e.month, k = e.category || "その他", v = Number(e.amount) || 0;
    byMonth[m] = (byMonth[m] || 0) + v;
    byCat[k] = (byCat[k] || 0) + v;
    (byCM[k] = byCM[k] || {})[m] = (byCM[k][m] || 0) + v;
  });
  const months = Object.keys(byMonth);
  const n = months.length || 1;                    /* 記録のある月だけで平均する */
  /* 個人は「個人で登録した支出」＋「やりくりでとっておく分」だけを見る */
  const extra = (f === "solo")
    ? myBudget(who).items.map(function(x){ return { k:x.name, v:x.amount * n, m:x.amount, fix:true }; })
    : [];
  const keepM = extra.reduce(function(t,x){ return t + x.m; }, 0);
  if (keepM) months.forEach(function(m){ byMonth[m] += keepM; });
  extra.forEach(function(x){ const o = {}; months.forEach(function(m){ o[m] = x.m; }); byCM[x.k] = o; });
  const total = rows.reduce(function(t,e){ return t + (Number(e.amount)||0); }, 0) + keepM * n;

  /* 貯金やカードも、カテゴリーの仲間として一緒に並べる */
  const ranked = Object.keys(byCat).map(function(k){ return { k:k, v:byCat[k], fix:false }; })
    .concat(extra).sort(function(a,b){ return b.v - a.v; });

  /* カテゴリーをタップすると、上のグラフもそのカテゴリーだけに切り替わる */
  const sel = (state.yearCat && byCM[state.yearCat]) ? state.yearCat : null;
  const series = sel ? byCM[sel] : byMonth;
  const selRow = sel ? ranked.filter(function(r){ return r.k === sel; })[0] : null;
  const sTotal = selRow ? selRow.v : total;
  const sCount = sel ? rows.filter(function(e){ return (e.category || "その他") === sel; }).length : rows.length;
  const peak = Math.max.apply(null, months.map(function(m){ return series[m] || 0; }).concat([0]));
  const col = sel ? (selRow && selRow.fix ? "var(--k0)" : catVar(sel)) : "var(--accent)";

  out.push('<section class="card"><div class="card-h">'
    + '<span class="card-t">'+(sel ? esc(sel) : esc(y)+'年の合計')+'</span>'
    + (sel ? '<button class="card-a" data-act="ycat" data-v="">すべて ✕</button>'
           : '<span class="card-n">'+rows.length+'件</span>')
    + '</div>'
    + '<div class="sumbox"><div class="sum-v">'+yen(sTotal)+'</div>'
    + '<div class="avgline">月平均 <b>'+yen(sTotal/n)+'</b><span>記録のある'+n+'ヶ月ぶん'
      + (sel && !(selRow && selRow.fix) ? '・'+sCount+'件' : '')+'</span></div>'
    + '<div class="ybars">'
    + Array.from({length:12}, function(_,i){
        const m = y + "-" + pad(i+1), v = series[m] || 0;
        const h = peak ? Math.max(v / peak * 100, v ? 4 : 1.5) : 1.5;
        return '<button class="yb'+(v?"":" off")+'" data-act="gomonth" data-v="'+m+'" title="'+(i+1)+'月 '+yen(v)+'">'
          + '<span class="yb-f" style="height:'+h.toFixed(1)+'%;background:'+(v?col:"")+'"></span>'
          + '<span class="yb-k">'+(i+1)+'</span></button>';
      }).join("")
    + '</div></div></section>');

  out.push('<section class="card"><div class="card-h"><span class="card-t">カテゴリー別</span>'
    + '<span class="card-n">合計 '+yen(total)+'</span></div><div class="rows">'
    + ranked.map(function(r){
        const w = total ? Math.max(r.v / total * 100, 2) : 0;
        const c2 = r.fix ? "var(--k0)" : catVar(r.k);
        return '<button class="row rowb" data-act="ycat" data-v="'+esc(r.k)+'" aria-pressed="'+(sel===r.k)+'">'
          + '<span class="row-l"><span class="cbadge sm" style="--k:'+c2+'">'
            + (r.fix ? saveIcon() : catIcon(r.k)) + '</span>'+esc(r.k)
            + (r.fix ? '<span class="tag keep">とっておき</span>' : '') + '</span>'
          + '<span class="row-v">'+yen(r.v)+'</span>'
          + '<span class="track"><span class="fill" style="width:'+w.toFixed(1)+'%;background:'+c2+'"></span></span>'
          + '<span class="row-s">月平均 '+yen(r.v/n)+'　/　'+Math.round(total?r.v/total*100:0)+'%</span></button>';
      }).join("")
    + '</div>'
    + (extra.length ? '<p class="bnote">貯金やカードは、やりくりで決めた毎月の額を'+n+'ヶ月ぶんにしためやすです。</p>' : '')
    + '</section>');
  return out.join("");
}

/* ---------- やりくり: 収入をどう割り振って、あといくら使えるか ---------- */
function myBudget(who){
  const b = state.budgets[who] || {};
  return { income: Number(b.income) || 0,
           items: (b.items || []).filter(x => x && x.name).map(function(x){
             return { id: x.id || uid("b"), name: String(x.name), amount: Number(x.amount) || 0 };
           }) };
}
function budgetHtml(names, who, c){
  const b = myBudget(who);
  const alloc = b.items.reduce(function(t,x){ return t + x.amount; }, 0);
  const free  = b.income - alloc;
  /* 使った額 = 自分の個人の支出 ＋ ふたりの支出のうち自分が負担するぶん */
  const mySolo = who === "b" ? c.soloB : c.soloA;
  const myDue  = who === "a" ? c.dueA : c.sharedTotal - c.dueA;
  const spent  = Math.round(mySolo + myDue);
  const left   = free - spent;
  const used   = free > 0 ? Math.min(spent / free * 100, 100) : (spent ? 100 : 0);
  const over   = left < 0;
  const out = [];

  if (!b.income && !b.items.length){
    return '<section class="card"><div class="empty">'+sleepingCat()
      + '<div class="empty-t">やりくりを決める</div>'
      + '<div class="empty-s">収入と、毎月の貯金・返済などを登録すると、<br>今月使えるお金と、あといくら使えるかが出ます。</div>'
      + '<div style="margin-top:16px"><button class="btn pri" data-act="bedit">はじめる</button></div></div></section>';
  }

  /* 見るところは1つ ―― 今月あといくら使えるか。その根拠を帯と1行で添える */
  const upct = free > 0 ? Math.min(Math.round(spent / free * 100), 100) : (spent ? 100 : 0);
  const rpct = Math.max(100 - upct, 0);
  out.push('<section class="card hero"><div class="hero-top plain">'
    + '<button class="hero-btn" data-act="bedit">編集</button>'
    + '<div class="hero-k">'+esc(names[who])+'・'+esc(ymLabel(state.month))+'</div>'
    + '<div class="hero-amt'+(over?" neg":"")+'">'+yen(left)+'</div>'
    + '<div class="hero-sub">'+(over ? '予定より使っています' : 'あと使えるお金')+'</div>'
    /* のこりの割合は、同じ紺の中の左にリングで */
    + '<span class="hero-ring">'+ring("", rpct, over ? "var(--danger)" : "#FFFFFF")+'</span>'
    + '</div></section>');

  const row = function(name, v, cls){
    return '<div class="brow'+(cls?" "+cls:"")+'"><span class="brow-n">'+esc(name)+'</span>'
         + '<span class="brow-v'+(v<0?" minus":"")+'">'+(v<0?"−":"")+yen(Math.abs(v))+'</span></div>';
  };
  out.push('<section class="card"><div class="card-h"><span class="card-t">内訳</span>'
    + '<button class="card-a" data-act="bedit">編集 ›</button></div><div class="blist">'
    + row("収入", b.income)
    + b.items.map(function(x){ return row(x.name, -x.amount, "ind"); }).join("")
    + row("今月使えるお金", free, "tot")
    + row(ymLabel(state.month)+"に使った", -spent, "ind")
    + row("あと使える", left, "tot hi")
    + '</div></section>');

  out.push('<section class="card"><div class="card-h"><span class="card-t">「使った」の中身</span>'
    + '<button class="card-a" data-act="view" data-v="detail">明細を見る ›</button></div><div class="blist">'
    + row("個人の支出", mySolo, "ind")
    + row("ふたりの支出のうち自分の負担", Math.round(myDue), "ind")
    + '</div><p class="bnote">家賃や食費など、ふたりの支出に入れているぶんは自動で引かれます。</p></section>');

  return out.join("");
}

let swTrack = null, swX = 0, swY = 0, swDX = 0, swAxis = null, swUntil = 0;
function closeSwipes(except){
  document.querySelectorAll(".swipe.open").forEach(function(s){ if (s !== except) s.classList.remove("open"); });
}
document.addEventListener("touchstart", function(ev){
  const s = ev.target.closest(".swipe");
  if (!s){ closeSwipes(null); swTrack = null; return; }
  swTrack = s; swX = ev.touches[0].clientX; swY = ev.touches[0].clientY; swDX = 0; swAxis = null;
}, {passive:true});
document.addEventListener("touchmove", function(ev){
  if (!swTrack) return;
  const it = swTrack.querySelector(".item"); if (!it) return;
  const dx = ev.touches[0].clientX - swX, dy = ev.touches[0].clientY - swY;
  if (swAxis === null){
    if (Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
    swAxis = Math.abs(dx) > Math.abs(dy) + 2 ? "x" : "y";
    if (swAxis === "x"){ closeSwipes(swTrack); it.style.transition = "none"; }
    else { swTrack = null; return; }
  }
  const base = swTrack.classList.contains("open") ? -SWIPE_W : 0;
  swDX = Math.max(-SWIPE_W - 16, Math.min(0, base + dx));
  it.style.transform = "translateX(" + swDX + "px)";
  if (ev.cancelable) ev.preventDefault();   /* the page must not scroll sideways mid-swipe */
}, {passive:false});
function swipeEnd(){
  if (!swTrack) return;
  const it = swTrack.querySelector(".item");
  if (it){ it.style.transition = ""; it.style.transform = ""; }
  if (swAxis === "x"){ swTrack.classList.toggle("open", swDX < -SWIPE_W / 2); swUntil = Date.now() + 350; }
  swTrack = null; swAxis = null;
}
document.addEventListener("touchend", swipeEnd);
document.addEventListener("touchcancel", swipeEnd);

document.addEventListener("click", function(ev){
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;

  /* the click that follows a swipe is the swipe itself, not a tap */
  if (Date.now() < swUntil && t.closest(".swipe")) return;
  if (act === "swipedel"){ closeSwipes(null); guard(dropExpense(t.dataset.id)); return; }
  /* while a row is open, a tap anywhere just puts it back */
  const openRow = document.querySelector(".swipe.open");
  if (openRow){ closeSwipes(null); if (openRow.contains(t)) return; }

  if (act === "prev"){ state.month = ymAdd(state.month,-1); state.cat = null; if (state.mode==="db") subExpenses(); else loadLocal(); materialize(); render(); return; }
  if (act === "next"){ state.month = ymAdd(state.month, 1); state.cat = null; if (state.mode==="db") subExpenses(); else loadLocal(); materialize(); render(); return; }
  if (act === "today"){ if (state.month===THIS_MONTH) return; state.month = THIS_MONTH; state.cat = null; if (state.mode==="db") subExpenses(); else loadLocal(); materialize(); render(); return; }
  if (act === "catfilt"){ state.cat = (state.cat === t.dataset.v) ? null : t.dataset.v; render(); return; }
  if (act === "catclear"){ state.cat = null; render(); return; }
  if (act === "view"){
    state.view = t.dataset.v; window.scrollTo(0,0);
    if (state.view === "year"){ state.year = state.month.slice(0,4); loadYear(state.year); return; }
    render(); return;
  }
  if (act === "filt"){ state.filter = t.dataset.v; state.yearCat = null; render(); return; }
  if (act === "who"){ state.soloWho = t.dataset.v; render(); return; }
  if (act === "meis"){
    readSettingsForm();
    state.me = t.dataset.v; state.soloWho = t.dataset.v;
    try{ localStorage.setItem("wk_me", state.me); }catch(e){}
    state.settings = Object.assign({}, state.settings, { defaultSolo: state.me });
    guard(putSettings(settingsBody()));
    t.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === t)));
    render(); return;
  }
  if (act === "ynav"){
    state.year = String(Number(state.year) + Number(t.dataset.v));
    state.yearCat = null; loadYear(state.year); return;
  }
  if (act === "ycat"){
    const v = t.dataset.v || "";
    state.yearCat = (v && state.yearCat !== v) ? v : null;
    window.scrollTo(0,0); render(); return;
  }
  if (act === "gomonth"){
    state.month = t.dataset.v; state.view = "detail"; state.cat = null;
    if (state.mode === "db") subExpenses(); else loadLocal();
    materialize(); window.scrollTo(0,0); render(); return;
  }
  if (act === "gatego"){
    const el = $("#g-room"), v = roomClean(el ? el.value : "");
    if (v.length < 8){
      if (el){ el.value = v; el.style.borderColor = "var(--danger)"; el.focus(); }
      const e2 = $(".gate-e");
      if (e2) e2.textContent = "8文字以上にしてください。";
      else { const h = document.querySelector(".gate-s");
             if (h) h.insertAdjacentHTML("afterend", '<p class="gate-e">8文字以上にしてください。</p>'); }
      return;
    }
    try{ localStorage.setItem(ROOM_KEY, v); }catch(e){}
    t.disabled = true; t.textContent = "つないでいます…";
    initFirebase(v).then(function(){
      $("#gate").hidden = true; document.body.classList.remove("gated");
    }).catch(function(err){
      const why = (err && (err.code || err.message)) ? String(err.code || err.message) : "不明";
      gateHtml("つながりませんでした（" + why + "）");
    });
    return;
  }
  if (act === "gateskip"){
    $("#gate").hidden = true; document.body.classList.remove("gated");
    state.mode = "local"; loadLocal(); state.ready = true; materialize(); render(); return;
  }
  if (act === "roomout"){
    try{ localStorage.removeItem(ROOM_KEY); }catch(e){}
    location.reload(); return;
  }
  if (act === "settings"){ settingsSheet(); return; }
  if (act === "bedit"){ budgetSheet(); return; }
  if (act === "badd"){
    readBudgetForm(); state.modal.items.push({ id: uid("b"), name:"", amount:0 }); renderBudgetSheet();
    setTimeout(function(){
      const all = document.querySelectorAll('[data-bi="name"]');
      if (all.length) all[all.length-1].focus();
    }, 60); return;
  }
  if (act === "bdel"){
    readBudgetForm();
    state.modal.items = state.modal.items.filter(function(x){ return x.id !== t.dataset.id; });
    if (!state.modal.items.length) state.modal.items.push({ id: uid("b"), name:"", amount:0 });
    renderBudgetSheet(); return;
  }
  if (act === "bsave"){
    readBudgetForm(); const d = state.modal;
    guard(putBudget(d.who, { income: d.income,
      items: d.items.filter(function(x){ return x.name; }).map(function(x){
        return { id:x.id, name:x.name, amount:x.amount }; }) }));
    closeModal(); return;
  }
  if (act === "add"){ if (state.readOnly) return; expenseSheet(null); return; }
  if (act === "edit"){ const e = state.expenses.find(x => x.id === t.dataset.id); if (e) expenseSheet(e); return; }
  if (act === "close"){ closeModal(); return; }
  if (act === "scrim"){ if (ev.target === t) closeModal(); return; }

  if (act === "settle"){
    const c = calc(state.expenses, state.settings.ratioA);
    guard(putSettlement(state.month, { amount:c.owed, from:c.from, to:c.to, settledAt: todayISO() })); return;
  }
  if (act === "unsettle"){ guard(dropSettlement(state.month)); return; }
  if (act === "clearsample"){
    state.expenses.filter(e => e.sample).forEach(e => guard(dropExpense(e.id))); return;
  }

  /* expense sheet */
  if (act === "pickcat"){     /* the list opens in place, right under the row */
    readExpenseForm();
    state.modal.picking = !state.modal.picking;
    if (!state.modal.picking) state.modal.addingCat = false;
    expenseSheet(state.modal); return;
  }
  if (act === "cat"){ state.modal.category = t.dataset.v; state.modal.picking = false; expenseSheet(state.modal); return; }
  if (act === "payer"){
    state.modal.payer = t.dataset.v;
    t.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === t)));
    updateSay(); return;
  }
  if (act === "shared"){
    readExpenseForm(); state.modal.shared = t.dataset.v === "1";
    if (!state.modal.shared) state.modal.bearer = null;
    expenseSheet(state.modal); return;
  }
  if (act === "bearer"){
    state.modal.bearer = t.dataset.v || null;
    t.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === t)));
    updateSay(); return;
  }
  if (act === "newcat"){
    readExpenseForm(); state.modal.addingCat = true; expenseSheet(state.modal);
    setTimeout(function(){ const el = $("#f-newcat"); if (el) el.focus(); }, 60); return;
  }
  if (act === "savecat"){
    readExpenseForm();
    const el = $("#f-newcat"), name = el ? el.value.trim() : "";
    if (!name || allCats().indexOf(name) >= 0){ if (el){ el.style.borderColor = "var(--danger)"; el.focus(); } return; }
    addCategory(name);
    state.modal.category = name; state.modal.addingCat = false; state.modal.picking = false;
    expenseSheet(state.modal); return;
  }
  if (act === "save"){
    readExpenseForm(); const d = state.modal;
    if (!d.amount || d.amount <= 0){ const el=$("#f-amt"); if(el){ el.style.borderColor="var(--danger)"; el.focus(); } return; }
    const rec = { month: d.date.slice(0,7), date: d.date, amount: d.amount, category: d.category,
                  payer: d.payer, shared: d.shared !== false, note: d.note || "",
                  bearer: d.shared !== false ? (d.bearer || null) : null,
                  recurringId: d.recurringId || null, createdAt: d.createdAt || Date.now() };
    if (d.id) rec.id = d.id;
    if (d.sample) rec.sample = true;
    guard(putExpense(rec)); closeModal(); return;
  }
  if (act === "delete"){ if (state.modal && state.modal.id) guard(dropExpense(state.modal.id)); closeModal(); return; }

  /* settings sheet */
  if (act === "xpayer"){ t.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === t))); return; }
  if (act === "addcat"){
    readSettingsForm();
    const el = $("#s-newcat"), name = el ? el.value.trim() : "";
    if (!name || allCats().indexOf(name) >= 0){ if (el){ el.style.borderColor = "var(--danger)"; el.focus(); } return; }
    addCategory(name); settingsSheet(); return;
  }
  if (act === "delcat"){ readSettingsForm(); removeCategory(t.dataset.v); settingsSheet(); return; }
  if (act === "addfix"){
    readSettingsForm();
    const name = $("#x-name").value.trim(), amt = Number(String($("#x-amt").value).replace(/[^0-9.-]/g,"")) || 0;
    if (!name || amt <= 0){ $("#x-name").style.borderColor = "var(--danger)"; return; }
    const payerBtn = document.querySelector('[data-act="xpayer"][aria-pressed="true"]');
    guard(putRecurring({ name: name, amount: amt, category: $("#x-cat").value,
      payer: payerBtn ? payerBtn.dataset.v : "a", shared: true,
      day: Math.min(31, Math.max(1, Number($("#x-day").value)||1)),
      startMonth: state.month, active: true })).then(()=>{ materialized.delete(state.month); setTimeout(settingsSheet, 120); });
    return;
  }
  if (act === "delfix"){ readSettingsForm(); guard(dropRecurring(t.dataset.id)).then(()=> setTimeout(settingsSheet,120)); return; }
  if (act === "savesettings"){ readSettingsForm(); guard(putSettings(settingsBody())); closeModal(); return; }
});

document.addEventListener("input", function(ev){
  if (ev.target.id === "f-amt" && state.modal){ readExpenseForm(); updateSay(); }
  if (ev.target.id === "s-ratio"){ const v = Number(ev.target.value); const el = $("#s-rv"); if (el) el.textContent = v + " : " + (100 - v); }
  if (ev.target.id === "s-a" || ev.target.id === "s-b"){
    const k = ev.target.id === "s-a" ? "a" : "b";
    const v = ev.target.value.trim() || (k === "a" ? DEFAULTS.nameA : DEFAULTS.nameB);
    document.querySelectorAll('[data-v="'+k+'"] .nm').forEach(function(el){ el.textContent = v; });
    if (k === "a") document.querySelectorAll(".nm-a").forEach(function(el){ el.textContent = v; });
  }
});
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape" && !$("#modal").hidden) closeModal(); });

render();
initStore();
})();
</script>
